[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostqa"
version = "0.4.0"
description = "AI-driven autonomous exploratory software testing system"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pillow>=10.0",
]

[tool.setuptools.packages.find]
include = ["ghostqa*", "benchmark*", "dashboard*"]

[tool.setuptools.package-data]
dashboard = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests requiring a real browser and local BuggyShop server",
]
