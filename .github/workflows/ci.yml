name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      # The v0.3.15 ordering test checks ancestor commits. A depth-1 checkout
      # does not contain them, so this job needs the full history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests (sim, no browser needed)
        run: |
          set +e
          python -m pytest -m "not integration" --tb=short > "$RUNNER_TEMP/pytest-unit.txt" 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::error::unit pytest exit $code"
            tail -n 40 "$RUNNER_TEMP/pytest-unit.txt" | while IFS= read -r line; do
              printf '%s\n' "$line" | sed 's/%/%25/g; s/\r/%0D/g' | while IFS= read -r safe; do
                echo "::error::$safe"
              done
            done
            exit "$code"
          fi

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -e ".[dev]"
          playwright install --with-deps chromium
      - name: Integration tests (real browser + BuggyShop)
        run: |
          set +e
          python -m pytest -m integration --tb=short > "$RUNNER_TEMP/pytest-integration.txt" 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::error::integration pytest exit $code"
            tail -n 40 "$RUNNER_TEMP/pytest-integration.txt" | while IFS= read -r line; do
              printf '%s\n' "$line" | sed 's/%/%25/g; s/\r/%0D/g' | while IFS= read -r safe; do
                echo "::error::$safe"
              done
            done
            exit "$code"
          fi
