<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>结算</title>
<link rel="stylesheet" href="case.css">
</head>
<body>
<h1>订单结算</h1>
<p>应付 ¥12</p>
<p><button type="button" id="btn_pay" data-testid="btn_pay">立即支付</button></p>
<script>
document.getElementById("btn_pay").onclick = function () {
  this.textContent = "正在支付";
  setTimeout(function () {
    throw new Error("价格计算失败");
  }, 0);
};
</script>
