<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>注册</title>
<link rel="stylesheet" href="case.css">
</head>
<body>
<h1>注册</h1>
<p><input id="reg_user" data-testid="reg_user" type="text" value="" placeholder="用户名" disabled></p>

};
